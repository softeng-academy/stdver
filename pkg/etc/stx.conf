#   multiview-style development dashboard
dev
    stmux -w always -m beep -e "built.in.+ms" -- \
    [ -s 50% "npm start lint-watch" : \
    -s 50% "npm start build-watch" ]

#   static code analysis (linting) with file watching
lint-watch
    nodemon --exec "npm start lint" --watch src --ext js,ts

#   static code analysis (linting)
lint : lint-tsc lint-eslint

#   lint via TypeScript compiler
lint-tsc
    tsc --project etc/tsc.json --noEmit

#   lint via ESLint
lint-eslint
    eslint --config etc/eslint.mjs --ext ts src/**/*.ts

#   code compilation/transpiling (building) with file watching
build-watch
    nodemon --exec "npm start build" --watch src --ext js,ts

#   build entire project
build : build-server build-client build-man-api build-man-cli

#   build server-side code
build-server
    tsc --project etc/tsc.json

#   build client-side code
build-client
    cross-env NODE_OPTIONS=--max-old-space-size=8192
    vite --config etc/vite.ts build --logLevel info --mode production

#   build API manual page
build-man-api
    remark --quiet --use remark-man --output dst/stdver.3 src/stdver-api.md

#   build CLI manual page
build-man-cli
    remark --quiet --use remark-man --output dst/stdver.1 src/stdver-cli.md

#   remove regularly built files
clean
    rimraf dst

#   remove all built files
clean-dist : clean
    rimraf dst node_modules

